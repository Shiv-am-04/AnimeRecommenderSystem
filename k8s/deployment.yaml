apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-recommender
  labels:
    app: anime-recommender
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anime-recommender
  template:
    metadata:
      labels:
        app: anime-recommender
    spec:
      containers:
      - name: anime-recommender
        image: your-docker-image:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: anime-recommender-service
spec:
  selector:
    app: anime-recommender
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
      app: my-app
  ports:
      - name: metrics
        port: 8000
        targetPort: 8000
  type: NodePort
  