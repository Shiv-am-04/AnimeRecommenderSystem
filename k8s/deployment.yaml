apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-recommender
  labels:
    app: anime-recommender
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: anime-recommender
  template:
    metadata:
      labels:
        app: anime-recommender
    spec:
      containers:
      - name: anime-recommender
        image: anime-recommender:v1
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
            
---
apiVersion: v1
kind: Service
metadata:
  name: anime-recommender-service
  labels:
    app: anime-recommender
spec:
  selector:
    app: anime-recommender
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      name: http
  type: NodePort
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
      app: anime-recommender
  ports:
      - name: metrics
        port: 8000
        targetPort: 8000
  type: NodePort
  